<script>
const $=s=>document.querySelector(s),PFX='EXAM1.',KEY='sx:exams',KD='sx:done',L='ABCD';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=s=>esc(s).replace(/\n/g,'<br>');
const SAMPLE=`Question 1: When we went back to the bookstore, the bookseller _ the book we wanted.
A. sold
*B. had sold
C. sells
D. has sold
Question 2 [TF]: Đọc thông tin sau:<br />Trong quá trình quang hợp, cây xanh dùng ánh sáng để biến nước và carbon dioxide thành glucose và oxygen.
*A. Quang hợp cần năng lượng ánh sáng.
*B. Quang hợp tạo ra oxygen.
C. Quang hợp chỉ xảy ra vào ban đêm.
*D. Lá cây là cơ quan chủ yếu thực hiện quang hợp.`;
let V='home',EX=null,G=null,CODE='',ERR='',DEL='',OPT={q:0,a:0},DRAFT={t:'',d:'',s:'',j:''},pt,tt;

/* ---------- Lưu cục bộ ---------- */
const ld=(k=KEY)=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
const sv=(a,k=KEY)=>{try{localStorage.setItem(k,JSON.stringify(a));return true}catch(e){return false}};
function toast(m){const e=$('#t');e.textContent=m;e.className='g s';clearTimeout(tt);tt=setTimeout(()=>e.className='g',2000)}
async function cpy(s){let ok=1;try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(_){ok=0}a.remove()}if(ok)SFX.cp();toast(ok?'Đã sao chép mã đề':'Không tự copy được — hãy chọn và copy thủ công')}

/* ---------- Share code: serialize → deflate → base64url ---------- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='==='.slice((s.length+3)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const pipe=async(u,S)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new S('deflate-raw'))).arrayBuffer());
async function encode(ex){
 const raw=new TextEncoder().encode(JSON.stringify(ex));let f=0,p=raw;
 try{p=await pipe(raw,CompressionStream);f=1}catch(e){p=raw;f=0}
 const o=new Uint8Array(p.length+1);o[0]=f;o.set(p,1);return PFX+b64(o)}
function chk(o){
 if(!o||o.v!==1||!Array.isArray(o.q)||!o.q.length||o.q.length>500)throw Error('x');
 o.q.forEach(q=>{if(!(q&&(q.y==='m'||q.y==='t')&&typeof q.s==='string'&&Array.isArray(q.o)&&q.o.length===4&&q.o.every(x=>typeof x==='string')&&(q.y==='m'?[0,1,2,3].includes(q.c):Array.isArray(q.c)&&q.c.length===4&&q.c.every(x=>x===0||x===1))))throw Error('x')});
 return{v:1,t:String(o.t||'Đề thi').slice(0,200),d:String(o.d||'').slice(0,1000),q:o.q}}
async function decode(c){
 c=c.replace(/\s+/g,'');
 if(!c)throw Error('Bạn chưa dán mã đề.');
 if(!c.startsWith(PFX))throw Error('Mã đề phải bắt đầu bằng “'+PFX+'”. Hãy copy đủ cả mã.');
 try{const u=unb(c.slice(PFX.length)),p=u.slice(1);
  return chk(JSON.parse(new TextDecoder().decode(u[0]===1?await pipe(p,DecompressionStream):p)))
 }catch(e){throw Error('Mã đề bị lỗi hoặc bị cắt thiếu. Hãy copy lại toàn bộ mã.')}}

/* ---------- Parser text → cấu trúc đề ---------- */
const BR=/<br\s*\/?>/gi,cl=s=>s.trim().replace(BR,'\n').replace(/ *\n */g,'\n').trim();
function parse(src){
 const qs=[],errs=[],t=src.normalize('NFC').replace(/\r/g,''),hs=[...t.matchAll(/(?:^|\n)[ \t]*(?:Question|Câu)\s*\d+\s*(\[(?:TF|MC)\])?\s*[:.]/gi)];
 if(!hs.length)return{qs,errs:t.trim()?['Không tìm thấy câu hỏi. Mỗi câu phải bắt đầu bằng “Question 1:”.']:[]};
 hs.forEach((h,i)=>{
  const n=i+1,b=t.slice(h.index+h[0].length,hs[i+1]?hs[i+1].index:undefined).replace(/\n+/g,' '),M=[...b.matchAll(/(^|\s)(\*?)([A-D])\.\s/g)],P=[];let lim=M.length;
  for(const c of 'DCBA'){let k=-1;for(let j=lim-1;j>=0;j--)if(M[j][3]===c){k=j;break}if(k<0)break;P.unshift(M[k]);lim=k}
  if(P.length<4)return errs.push(`Câu ${n}: thiếu đáp án (cần đủ A, B, C, D).`);
  const o=P.map((m,j)=>cl(b.slice(m.index+m[0].length,j<3?P[j+1].index:undefined))),s=cl(b.slice(0,P[0].index)),st=P.map(m=>m[2]==='*'),k=st.filter(Boolean).length,tag=(h[1]||'').slice(1,3).toLowerCase(),y=tag||(k===1?'mc':'tf');
  if(!s)errs.push(`Câu ${n}: chưa có nội dung câu hỏi.`);
  if(o.some(x=>!x))errs.push(`Câu ${n}: có đáp án bị trống.`);
  if(!tag&&!k)return errs.push(`Câu ${n}: chưa có dấu * đánh dấu đáp án đúng (nếu cả 4 nhận định đều Sai, thêm [TF] sau “Question ${n}”).`);
  if(y==='mc'&&k!==1)return errs.push(`Câu ${n}: trắc nghiệm [MC] cần đúng 1 dấu *.`);
  qs.push({y:y==='mc'?'m':'t',s,o,c:y==='mc'?st.indexOf(true):st.map(Number)})
 });
 return{qs,errs}}

/* ---------- Làm bài ---------- */
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const done=t=>t.q.y==='m'?t.a!=null:t.a.every(x=>x!=null);
const good=t=>t.q.y==='m'?t.ord[t.a]===t.q.c:t.a.every((x,j)=>x===t.q.c[t.ord[j]]);
function start(idx){
 let ids=idx||EX.q.map((_,i)=>i);if(OPT.q)ids=sh(ids);
 G={i:0,fin:0,t0:Date.now(),it:ids.map(k=>{const q=EX.q[k];return{q,ord:OPT.a?sh([0,1,2,3]):[0,1,2,3],a:q.y==='m'?null:[null,null,null,null]}})};
 go('play')}

/* ---------- Giao diện ---------- */

async function make(){

 const ex={v:1,t:DRAFT.t.trim()||'Đề không tên',d:DRAFT.d.trim(),q:qs};

let CUR='',TAB='mine';

function track(c){c=c.replace(/\s+/g,'');const id=hid(c),a=ld(KD),old=a.find(x=>x.id===id),o=old||{id,n:EX.q.length,code:c,tries:0,last:null,best:null};o.title=EX.t;o.date=Date.now();sv([o,...a.filter(x=>x.id!==id)],KD);if(!old)toast('Đã lưu vào “Đề đã làm”');return id}
function upd(ok,n){const a=ld(KD),o=a.find(x=>x.id===CUR);if(!o)return;const s=ok/n*10;o.tries=(o.tries||0)+1;o.last=s;o.best=Math.max(o.best||0,s);o.date=Date.now();sv(a,KD)}

const Jn=()=>`<h2>Nhập mã đề</h2><div class="g"><textarea id="jc" spellcheck="false" style="min-height:170px" placeholder="Dán mã đề (bắt đầu bằng ${PFX}) vào đây">${esc(DRAFT.j)}</textarea>${ERR?`<div class="er" role="alert">⚠ ${esc(ERR)}</div>`:''}<button class="b p" data-a="load">Mở đề</button></div>`;

const Su=()=>`<h2>${esc(EX.t)}</h2><p class="mu">${esc(EX.d)}</p><div class="g"><b>${EX.q.length} câu hỏi</b><label class="row"><input type="checkbox" id="sq" ${OPT.q?'checked':''}><span>Đảo câu hỏi</span></label><label class="row"><input type="checkbox" id="sa" ${OPT.a?'checked':''}><span>Đảo đáp án</span></label><button class="b p" data-a="start">Bắt đầu làm bài</button></div>`;

function Pl(){
 const n=G.it.length,t=G.it[G.i],q=t.q,ans=G.it.filter(done).length;let body='';

   +(t.a==null?'':t.a===ci?'<div class="fb ok">✓ Chính xác</div>':`<div class="fb bad">✕ Chưa chính xác<br>Đáp án đúng: ${L[ci]}</div>`);
 }else{
  body='<div class="mu" style="margin-bottom:6px">Chọn Đúng hoặc Sai cho từng nhận định.</div>'+t.ord.map((k,j)=>{const x=t.a[j],r=q.c[k];
   return`<div class="st"><div><b>${L[j]}.</b> ${fm(q.o[k])}</div><div class="tf">${[1,0].map(v=>`<button class="b${x==null?'':v===r?' ok':x===v?' bad':''}" data-a="tf" data-j="${j}" data-v="${v}" ${x!=null?'disabled':''}>${v?'Đúng':'Sai'}</button>`).join('')}</div>${x==null?'':x===r?'<div class="fb ok">✓ Chính xác</div>':`<div class="fb bad">✕ Chưa chính xác. Đáp án đúng: ${r?'Đúng':'Sai'}</div>`}</div>`}).join('');
 }
 return`<div class="mu" style="display:flex;justify-content:space-between"><b>Câu ${G.i+1} / ${n}</b><span>Đã làm ${ans}/${n}</span></div><div class="bar"><i style="width:${ans/n*100}%"></i></div>

 <div class="g chips">${G.it.map((x,i)=>`<button class="chip${i===G.i?' cur':''}${done(x)?good(x)?' ok':' bad':''}" data-a="jump" data-j="${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div>

function Rs(){
 const n=G.it.length,ok=G.it.filter(t=>done(t)&&good(t)).length,sk=G.it.filter(t=>!done(t)).length,bad=n-ok-sk,s10=(ok/n*10).toLocaleString('vi-VN',{maximumFractionDigits:2});
 return`<div class="g hs"><div class="mu">Hoàn thành</div><div class="ring" role="img" aria-label="Điểm ${s10} trên 10"><svg viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f86ff"/><stop offset="1" stop-color="#c47cff"/></linearGradient></defs><g stroke="currentColor" stroke-opacity=".3" stroke-width="2" stroke-linecap="round">${Array.from({length:10},(_,i)=>`<line x1="191" y1="100" x2="197" y2="100" transform="rotate(${i*36} 100 100)"/>`).join('')}</g><circle cx="100" cy="100" r="84" fill="none" stroke="currentColor" stroke-opacity=".1" stroke-width="12"/><circle class="pg" cx="100" cy="100" r="84" fill="none" stroke="url(#sg)" stroke-width="12" stroke-linecap="round" style="stroke-dashoffset:${528*(1-ok/n)};${ok?'':'opacity:0'}"/></svg><div class="sc"><b id="sn" data-v="${ok/n*10}">${s10}</b><span>trên 10 điểm</span></div></div><div class="gr">${gr(ok/n*10)}</div><div class="ss"><div><b>${ok}/${n}</b>câu đúng</div><div><b>${bad}</b>câu sai</div><div><b>${sk}</b>chưa làm</div><div><b>${Math.round(ok/n*100)}%</b>chính xác</div><div><b>${(d=>Math.floor(d/60)+':'+String(d%60).padStart(2,'0'))(Math.round(((G.t1||Date.now())-G.t0)/1000))}</b>thời gian</div></div></div>
 <div class="g"><h2>Từng câu</h2><div class="mu">Bấm vào một câu để xem lại đáp án.</div>${G.it.map((t,i)=>`<button class="rw" data-a="jump" data-j="${i}"><span>Câu ${i+1}</span><b class="${done(t)?good(t)?'ok':'bad':'mu'}">${done(t)?good(t)?'✓':'✕':'–'}</b></button>`).join('')}</div>
 <div style="display:flex;flex-wrap:wrap;gap:10px"><button class="b p" data-a="review">Xem lại đáp án</button>${bad+sk?'<button class="b" data-a="redo">Làm lại các câu sai</button>':''}<button class="b" data-a="again">Làm lại toàn bộ</button></div>`}

const gr=x=>x>=9?'Xuất sắc':x>=8?'Giỏi':x>=6.5?'Khá':x>=5?'Trung bình':'Cần cố gắng thêm';
function cu(){const e=$('#sn');if(!e||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const T=+e.dataset.v,t0=performance.now();
 const f=t=>{const k=Math.min(1,(t-t0)/1500);e.textContent=(T*(1-Math.pow(1-k,3))).toLocaleString('vi-VN',{maximumFractionDigits:2});if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
let AC,MUTE=false;try{MUTE=localStorage.getItem('sx:mute')==='1'}catch(e){}
const hp=p=>{if(!MUTE)try{navigator.vibrate(p)}catch(e){}};
function tn(f,t=0,d=.25,v=.1,ty='sine'){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime+t,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
const SFX={tap:()=>tn(1500,0,.06,.04,'triangle'),sel:()=>{tn(700,0,.14,.07);tn(1050,.04,.14,.04)},ok:()=>{hp(12);tn(784,0,.4,.09);tn(1175,.09,.55,.08);tn(1568,.09,.55,.03)},bad:()=>{hp([16,50,16]);tn(311,0,.3,.09,'triangle');tn(233,.11,.45,.08,'triangle')},cp:()=>{tn(1318,0,.1,.06);tn(1760,.07,.16,.05)},er:()=>tn(196,0,.25,.09,'triangle'),end:()=>[523,659,784,1047].forEach((f,i)=>tn(f,i*.11,.7,.08))};
const I1='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/>',IC={on:I1+'<path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',off:I1+'<path d="M17 9l5 6M22 9l-5 6"/></svg>'};
const VIEWS={home:Hm,create:Cr,mine:Mn,join:Jn,setup:Su,play:Pl,result:Rs};
function R(a){
 $('#app').innerHTML=`<div class="top"><span class="brand" data-a="home">◐ ltgiBo.exam</span><span class="tr">${V!=='home'?'<button class="b" data-a="home">Trang chủ</button>':''}<button class="b sb" data-a="snd" aria-label="Bật/tắt âm thanh">${MUTE?IC.off:IC.on}</button></span></div><div class="view${a?' an':''}">${VIEWS[V]()}</div>`;
 if(a)scrollTo(0,0);
 if(V==='create')pv();if(V==='result')cu()}
function go(v){V=v;if(v==='result'){if(!G.fin){G.t1=Date.now();SFX.end();if(CUR&&G.it.length===EX.q.length)upd(G.it.filter(t=>done(t)&&good(t)).length,G.it.length)}G.fin=1}R(1)}
async function openCode(c,rec){try{EX=await decode(c);ERR='';CUR=rec?track(c):'';go('setup')}catch(e){ERR=e.message;SFX.er();R()}}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 const a=el.dataset.a,j=+el.dataset.j,id=el.dataset.id,t=G&&G.it[G.i],ex=()=>ld(TAB==='done'?KD:KEY).find(x=>x.id===id);
 if(!{pick:1,tf:1,cp:1,cpid:1,make:1,snd:1}[a])SFX.tap();switch(a){
 case'mine':TAB='mine';case'home':case'create':case'join':ERR='';DEL='';if(a==='create')CODE='';go(a);break;

 case'cp':cpy(CODE);break;

 case'open':if(ex())openCode(ex().code);break;
 case'cpid':if(ex())cpy(ex().code);break;
 case'del':if(DEL===id){{const k=TAB==='done'?KD:KEY;sv(ld(k).filter(x=>x.id!==id),k)};DEL=''}else DEL=id;R();break;
 case'load':DRAFT.j=$('#jc').value;openCode(DRAFT.j,1);break;

 case'pick':if(t.a==null){t.a=j;good(t)?SFX.ok():SFX.bad();R()}break;

 case'prev':G.i--;R(1);break;
 case'next':G.i++;R(1);break;
 case'jump':G.i=j;go('play');break;
 case'fin':go('result');break;
 case'review':G.i=Math.max(0,G.it.findIndex(x=>!done(x)||!good(x)));go('play');break;

 }});
