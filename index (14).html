/* ---------- Share code: serialize → deflate → base64url ---------- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='==='.slice((s.length+3)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const pipe=async(u,S)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new S('deflate-raw'))).arrayBuffer());
async function encode(ex){
 const raw=new TextEncoder().encode(JSON.stringify(ex));let f=0,p=raw;
 try{p=await pipe(raw,CompressionStream);f=1}catch(e){p=raw;f=0}
 const o=new Uint8Array(p.length+1);o[0]=f;o.set(p,1);return PFX+b64(o)}
function chk(o){
 if(!o||o.v!==1||!Array.isArray(o.q)||!o.q.length||o.q.length>500)throw Error('x');
 o.q.forEach(q=>{if(!(q&&(q.y==='m'||q.y==='t')&&typeof q.s==='string'&&Array.isArray(q.o)&&q.o.length===4&&q.o.every(x=>typeof x==='string')&&(q.y==='m'?[0,1,2,3].includes(q.c):Array.isArray(q.c)&&q.c.length===4&&q.c.every(x=>x===0||x===1))))throw Error('x')});
 return{v:1,t:String(o.t||'Đề thi').slice(0,200),d:String(o.d||'').slice(0,1000),q:o.q}}
async function decode(c){
 c=c.replace(/\s+/g,'');
 if(!c)throw Error('Bạn chưa dán mã đề.');
 if(!c.startsWith(PFX))throw Error('Mã đề phải bắt đầu bằng “'+PFX+'”. Hãy copy đủ cả mã.');
 try{const u=unb(c.slice(PFX.length)),p=u.slice(1);
  return chk(JSON.parse(new TextDecoder().decode(u[0]===1?await pipe(p,DecompressionStream):p)))
 }catch(e){throw Error('Mã đề bị lỗi hoặc bị cắt thiếu. Hãy copy lại toàn bộ mã.')}}

/* ---------- Parser text → cấu trúc đề ---------- */
const BR=/<br\s*\/?>/gi,cl=s=>s.trim().replace(BR,'\n').replace(/ *\n */g,'\n').trim();
function parse(src){
 const qs=[],errs=[],t=src.normalize('NFC').replace(/\r/g,''),hs=[...t.matchAll(/(?:^|\n)[ \t]*(?:Question|Câu)\s*\d+\s*(\[(?:TF|MC)\])?\s*[:.]/gi)];
 if(!hs.length)return{qs,errs:t.trim()?['Không tìm thấy câu hỏi. Mỗi câu phải bắt đầu bằng “Question 1:”.']:[]};
 hs.forEach((h,i)=>{
  const n=i+1,b=t.slice(h.index+h[0].length,hs[i+1]?hs[i+1].index:undefined).replace(/\n+/g,' '),M=[...b.matchAll(/(^|\s)(\*?)([A-D])\.\s/g)],P=[];let lim=M.length;
  for(const c of 'DCBA'){let k=-1;for(let j=lim-1;j>=0;j--)if(M[j][3]===c){k=j;break}if(k<0)break;P.unshift(M[k]);lim=k}
  if(P.length<4)return errs.push(`Câu ${n}: thiếu đáp án (cần đủ A, B, C, D).`);
  const o=P.map((m,j)=>cl(b.slice(m.index+m[0].length,j<3?P[j+1].index:undefined))),s=cl(b.slice(0,P[0].index)),st=P.map(m=>m[2]==='*'),k=st.filter(Boolean).length,tag=(h[1]||'').slice(1,3).toLowerCase(),y=tag||(k===1?'mc':'tf');
  if(!s)errs.push(`Câu ${n}: chưa có nội dung câu hỏi.`);
  if(o.some(x=>!x))errs.push(`Câu ${n}: có đáp án bị trống.`);
  if(!tag&&!k)return errs.push(`Câu ${n}: chưa có dấu * đánh dấu đáp án đúng (nếu cả 4 nhận định đều Sai, thêm [TF] sau “Question ${n}”).`);
  if(y==='mc'&&k!==1)return errs.push(`Câu ${n}: trắc nghiệm [MC] cần đúng 1 dấu *.`);
  qs.push({y:y==='mc'?'m':'t',s,o,c:y==='mc'?st.indexOf(true):st.map(Number)})
 });
 return{qs,errs}}
